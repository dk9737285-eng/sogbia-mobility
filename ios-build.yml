name: Build SogBia iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  build:
    name: Build iOS Native App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 1. BUILD FOR NATIVE PHYSICAL IPHONE (.IPA)
      # ----------------------------------------------------
      - name: Build for Physical iPhone (Device)
        run: |
          xcodebuild -project sogbia-ios/SogBia.xcodeproj \
                     -scheme SogBia \
                     -sdk iphoneos \
                     -configuration Release \
                     clean build \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package as .IPA (For Sideloading on Windows)
        run: |
          # Find the compiled .app file for physical devices
          DEVICE_APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "SogBia.app" -path "*/Release-iphoneos/*" -type d | head -n 1)
          if [ -z "$DEVICE_APP_PATH" ]; then
            echo "Could not find Release-iphoneos SogBia.app"
            exit 1
          fi
          echo "Found Device App at: $DEVICE_APP_PATH"
          
          # Create Payload directory and copy the app inside to conform to IPA standards
          mkdir -p ~/Payload
          cp -r "$DEVICE_APP_PATH" ~/Payload/
          
          # Zip it into a standard installable .ipa file
          cd ~
          zip -r SogBia.ipa Payload
          mv SogBia.ipa $GITHUB_WORKSPACE/

      # ----------------------------------------------------
      # 2. BUILD FOR SIMULATOR (OPTIONAL WEB PREVIEW)
      # ----------------------------------------------------
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project sogbia-ios/SogBia.xcodeproj \
                     -scheme SogBia \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     clean build \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package Simulator App
        run: |
          SIM_APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "SogBia.app" -path "*/Debug-iphonesimulator/*" -type d | head -n 1)
          if [ -z "$SIM_APP_PATH" ]; then
            echo "Could not find Debug-iphonesimulator SogBia.app"
            exit 1
          fi
          echo "Found Simulator App at: $SIM_APP_PATH"
          
          cd "$(dirname "$SIM_APP_PATH")"
          zip -r $GITHUB_WORKSPACE/SogBia-iPhone-Simulator.zip SogBia.app

      # ----------------------------------------------------
      # 3. UPLOAD THE BUILD PRODUCTS
      # ----------------------------------------------------
      - name: Upload Physical iPhone .IPA (For Windows Sideloading)
        uses: actions/upload-artifact@v4
        with:
          name: SogBia-Physical-iPhone-IPA
          path: SogBia.ipa

      - name: Upload Web Simulator Build (For Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: SogBia-iPhone-Simulator
          path: SogBia-iPhone-Simulator.zip
