name: Build SogBia iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  build:
    name: Build iOS Native App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # AUTO-DETECT XCODE PROJECT PATHS & SCHEME
      # ----------------------------------------------------
      - name: Auto-Detect Project Files
        id: detect
        run: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJECT_PATH" ]; then
            echo "Error: Could not find any .xcodeproj file in the repository!"
            exit 1
          fi
          echo "PROJECT_PATH=$PROJECT_PATH" >> $GITHUB_ENV
          echo "Found Xcode project at: $PROJECT_PATH"
          
          # Auto-extract scheme name
          SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_PATH" | sed -n '/Schemes:/{n;p;}' | tr -d ' ')
          if [ -z "$SCHEME_NAME" ]; then
            SCHEME_NAME="SogBia"
          fi
          echo "SCHEME_NAME=$SCHEME_NAME" >> $GITHUB_ENV
          echo "Auto-detected scheme name: $SCHEME_NAME"

      # ----------------------------------------------------
      # 1. BUILD FOR NATIVE PHYSICAL IPHONE (.IPA)
      # ----------------------------------------------------
      - name: Build for Physical iPhone (Device)
        run: |
          xcodebuild -project "${{ env.PROJECT_PATH }}" \
                     -scheme "${{ env.SCHEME_NAME }}" \
                     -sdk iphoneos \
                     -configuration Release \
                     clean build \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package as .IPA (For Sideloading on Windows)
        run: |
          # Find compiled .app for physical device
          DEVICE_APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -path "*/Release-iphoneos/*" -type d | head -n 1)
          if [ -z "$DEVICE_APP_PATH" ]; then
            echo "Error: Could not find compiled app binary!"
            exit 1
          fi
          echo "Found Device App at: $DEVICE_APP_PATH"
          
          mkdir -p ~/Payload
          cp -r "$DEVICE_APP_PATH" ~/Payload/
          
          cd ~
          zip -r SogBia.ipa Payload
          mv SogBia.ipa $GITHUB_WORKSPACE/

      # ----------------------------------------------------
      # 2. BUILD FOR SIMULATOR (OPTIONAL WEB PREVIEW)
      # ----------------------------------------------------
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project "${{ env.PROJECT_PATH }}" \
                     -scheme "${{ env.SCHEME_NAME }}" \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     clean build \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package Simulator App
        run: |
          SIM_APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -path "*/Debug-iphonesimulator/*" -type d | head -n 1)
          if [ -z "$SIM_APP_PATH" ]; then
            echo "Error: Could not find compiled simulator binary!"
            exit 1
          fi
          echo "Found Simulator App at: $SIM_APP_PATH"
          
          cd "$(dirname "$SIM_APP_PATH")"
          zip -r $GITHUB_WORKSPACE/SogBia-iPhone-Simulator.zip $(basename "$SIM_APP_PATH")

      # ----------------------------------------------------
      # 3. UPLOAD THE BUILD PRODUCTS
      # ----------------------------------------------------
      - name: Upload Physical iPhone .IPA (For Windows Sideloading)
        uses: actions/upload-artifact@v4
        with:
          name: SogBia-Physical-iPhone-IPA
          path: SogBia.ipa

      - name: Upload Web Simulator Build (For Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: SogBia-iPhone-Simulator
          path: SogBia-iPhone-Simulator.zip
